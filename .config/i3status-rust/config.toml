# phone
[[block]]
block = "bluetooth"
mac = ""
format = "[$icon{$percentage|}]"
disconnected_format = ""
[block.battery_state]
"0..20" = "warning"
"21..100" = "idle"
[[block.click]]
button = "right"
cmd = "true"

[[block]]
block = "backlight"
format = "[$icon$brightness]"
[[block.click]]
button = "left"
cmd = "true"

[[block]]
block = "net"
device = "^(wl|wlan).*"
format = "[$icon{$signal_strength}]"
inactive_format = ""
interval = 5

[[block]]
block = "net"
device = "^(en|eth).*"
format = "[$icon]"
missing_format = ""

[[block]]
block = "time"
format = "[$icon$timestamp.datetime(f:'%a %m-%d %R')]"
