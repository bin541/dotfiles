[ids]
*

[main]
capslock = overload(nav, esc)

rightalt = layer(x)

leftalt = layer(meta)
leftmeta = layer(alt)

[nav]
d = delete
enter = backspace

h = left
j = down
k = up
l = right

u = home
p = end

m = pageup
/ = pagedown

[x]
q = brightnessdown
r = brightnessup

a = volumedown
f = volumeup
m = mute
